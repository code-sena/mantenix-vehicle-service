spring.application.name=vehicle-service

# Port: see ADR-002 (vehicle-service = 8083)
server.port=${SERVER_PORT:8083}

# Database: own database per service (ADR-004)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/mantenix_vehicles}
spring.datasource.username=${DB_USERNAME:mantenix}
spring.datasource.password=${DB_PASSWORD:mantenix}

# Hibernate only validates the schema; Flyway creates and changes it (ADR-004)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway migrations: src/main/resources/db/migration
spring.flyway.enabled=true

# Swagger UI: http://localhost:8083/swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# Health check: http://localhost:8083/actuator/health
management.endpoints.web.exposure.include=health,info

# API messages always in English (ADR-001), regardless of the machine language
spring.web.locale=en
spring.web.locale-resolver=fixed
